name: Build and Test Pygame

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      # Checkout repository
      - uses: actions/checkout@v4
      
      # Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      # Install system dependencies for Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libfreetype6-dev \
            libportmidi-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libwebp-dev
      
      # Install system dependencies for macOS
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf portmidi
      
      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython
      
      # Build pygame
      - name: Build pygame
        run: |
          python setup.py build_ext --inplace
      
      # Install pygame in development mode
      - name: Install pygame in development mode
        run: |
          pip install -e .
      
      # Run tests
      - name: Run pygame tests
        run: |
          python -m pytest test/ -v --tb=short
        continue-on-error: true
      
      # Verify pygame installation
      - name: Verify pygame installation
        run: |
          python -c "import pygame; print(f'Pygame version: {pygame.__version__}'); pygame.init(); print('Pygame initialized successfully')"
